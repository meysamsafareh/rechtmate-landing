<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RechtMate</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#17375E;
    color:white;
    text-align:center;
}

.container{
    max-width:700px;
    padding:40px;
}

h1{

    color:white;
    border:none;
    border-radius:8px;
    padding:16px 32px;
    font-size:18px;

button:hover{
    opacity:0.9;

<div class="container">

    <h1>RechtMate 🚀</h1>

</html>
